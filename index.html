<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aklan State University Makato Campus undergraduate program compliance gateway.">
  <meta name="theme-color" content="#0b7734">
  <title>Undergraduate Program Compliance | ASU Makato Campus</title>
  <link rel="preload" href="assets/images/aklan-state-university.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#program-links">Skip to program links</a>

  <main class="gateway" id="main-content">
    <h1 class="sr-only">Aklan State University Makato Campus Undergraduate Program Compliance</h1>

    <section class="poster" aria-label="Undergraduate programs">
      <picture>
        <source srcset="assets/images/aklan-state-university.webp" type="image/webp">
        <img src="assets/images/aklan-state-university.jpg" width="1921" height="1080"
             alt="Aklan State University Makato Campus undergraduate programs: BSESS, BTLED-HE, BPED, and BCED">
      </picture>

      <div class="poster__hotspots" id="program-links" aria-label="Select a program">
        <a class="hotspot hotspot--bsess" href="bsess.html" aria-label="Open the BSESS accreditation portal">
          <span>Open BSESS Accreditation Portal</span>
        </a>
        <button class="hotspot hotspot--btled" type="button" data-program="BTLED-HE" aria-label="BTLED-HE portal is coming soon">
          <span>BTLED-HE portal coming soon</span>
        </button>
        <button class="hotspot hotspot--bped" type="button" data-program="BPED" aria-label="BPED portal is coming soon">
          <span>BPED portal coming soon</span>
        </button>
        <button class="hotspot hotspot--bced" type="button" data-program="BCED" aria-label="BCED portal is coming soon">
          <span>BCED portal coming soon</span>
        </button>
      </div>
    </section>

    <nav class="mobile-programs" aria-label="Program compliance portals">
      <p>Choose a program</p>
      <a class="mobile-program mobile-program--live" href="bsess-accre-portal.html">
        <strong>BSESS</strong><span>Bachelor of Science in Exercise and Sport Sciences</span><b>Open portal →</b>
      </a>
      <button class="mobile-program" type="button" data-program="BTLED-HE"><strong>BTLED-HE</strong><span>Bachelor of Technology and Livelihood Education</span><b>Coming soon</b></button>
      <button class="mobile-program" type="button" data-program="BPED"><strong>BPED</strong><span>Bachelor of Physical Education</span><b>Coming soon</b></button>
      <button class="mobile-program" type="button" data-program="BCED"><strong>BCED</strong><span>Bachelor of Early Childhood Education</span><b>Coming soon</b></button>
    </nav>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastMessage"></span>
    <button type="button" id="toastClose" aria-label="Close notification">×</button>
  </div>
</body>
</html>
